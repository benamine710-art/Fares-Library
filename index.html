<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Fares Library — الكاشير</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#14304d;--ink2:#1f4a75;--bg:#eef1f5;--c:#fff;--t:#16202c;--m:#6a7686;--b:#d9dfe7;--hl:#ffd23f;--ok:#0f8a5f;--no:#c62f2f;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1620;--c:#16222f;--t:#e8eef5;--m:#8b98a8;--b:#28384a}}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);padding-bottom:140px}
header{background:var(--ink);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}header small{opacity:.7}
main{max-width:720px;margin:auto;padding:12px}
input,select{width:100%;padding:12px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;font-size:16px;margin:3px 0}
button{font:inherit;font-weight:600;padding:12px 14px;border:0;border-radius:8px;background:var(--ink2);color:#fff}
button.o{background:var(--c);color:var(--t);border:1px solid var(--b)}button.ok{background:var(--ok)}button.no{background:var(--no)}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>.f0{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.p{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;text-align:right;color:var(--t);font-weight:400;display:flex;flex-direction:column;gap:6px;min-height:92px;justify-content:space-between}
.p b{font-size:17px;color:var(--ink2)}.p small{color:var(--m)}
.low{color:var(--no)!important}
.box{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin-top:10px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--b);gap:8px}
.li:last-child{border:0}.li small{color:var(--m);display:block}
.q{display:flex;align-items:center;gap:8px}.q button{padding:4px 12px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:6}
nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ink2);box-shadow:inset 0 3px 0 var(--ink2)}
#bar{position:fixed;bottom:52px;inset-inline:0;background:var(--ink);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:6;margin-bottom:env(safe-area-inset-bottom,0)}
#bar span{font-size:24px;font-weight:700;background:var(--hl);color:#000;padding:2px 10px;border-radius:6px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}
.mod>div{background:var(--bg);width:100%;max-width:720px;margin:auto;border-radius:14px 14px 0 0;padding:14px;max-height:90vh;overflow:auto}
video{width:100%;border-radius:8px;background:#000;margin-top:8px}
#toast{position:fixed;top:64px;inset-inline:16px;background:var(--ink);color:#fff;padding:12px;border-radius:8px;z-index:20;text-align:center}
.debt{color:var(--no);font-weight:700}
</style></head><body>
<div id="toast" hidden></div>
<header><div><b>Fares Library</b><br><small id="who">—</small></div><button class="o" id="out" onclick="logout()" hidden>خروج</button></header>
<main id="setup" hidden><div class="box"><h3>ربط قاعدة البيانات</h3><input id="su" placeholder="Project URL"><input id="sk" placeholder="anon public key"><button style="width:100%;margin-top:8px" onclick="saveCfg()">حفظ</button></div></main>
<main id="login" hidden><div class="box"><h3>تسجيل الدخول</h3><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة السر"><button style="width:100%;margin-top:8px" onclick="signin()">دخول</button></div></main>
<main id="app" hidden>
<section id="v-pos"><div class="r"><input id="q" placeholder="ابحث بالاسم أو الباركود" oninput="showP()" onkeydown="if(event.key=='Enter')enter()"><button class="f0" onclick="scan(v=>{$('q').value=v;enter()})">📷 مسح</button></div><video id="vid" hidden playsinline muted></video><div class="grid" id="grid"></div>
<div class="box"><b>السلة</b><div id="cart"></div></div></section>
<section id="v-prod" hidden><div class="r"><input id="pq" placeholder="بحث في المنتجات" oninput="listP()"><button class="f0" onclick="editP()">+ منتج</button></div><div class="box" id="plist"></div></section>
<section id="v-cust" hidden><div class="r"><input id="cq" placeholder="بحث عن زبون" oninput="listC()"><button class="f0" onclick="editC()">+ زبون</button></div><div class="box" id="clist"></div></section>
<section id="v-soon" hidden><div class="box"><b>قريباً في المراحل القادمة</b><div class="li">الموردون والمشتريات</div><div class="li">المصاريف</div><div class="li">المرتجعات</div><div class="li">التقارير</div></div></section>
</main>
<div id="bar" hidden><div><small>الإجمالي</small><br><span id="tot">0</span></div><button class="ok" onclick="payDlg()">دفع ←</button></div>
<nav id="nav" hidden><button class="on" onclick="go('pos',this)">🛒 بيع</button><button onclick="go('prod',this)">📦 منتجات</button><button onclick="go('cust',this)">👥 زبائن</button><button onclick="go('soon',this)">⋯ المزيد</button></nav>
<div id="mod" class="mod" hidden><div id="modc"></div></div>
<script>
const $=i=>document.getElementById(i),f=n=>(+n||0).toFixed(2),INF=9999;
let sb,P=[],C=[],cart=[],stream=null;
const cfg=JSON.parse(localStorage.getItem('cfg')||'null');
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3000)}
function saveCfg(){localStorage.setItem('cfg',JSON.stringify({u:$('su').value.trim(),k:$('sk').value.trim()}));location.reload()}
async function init(){
 if(!cfg){$('setup').hidden=false;return}
 sb=supabase.createClient(cfg.u,cfg.k);
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('login').hidden=false;return}
 start(session)}
async function signin(){const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)toast('فشل الدخول: '+error.message);else location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(s){$('who').textContent=s.user.email;$('out').hidden=false;$('login').hidden=true;
 ['app','bar','nav'].forEach(x=>$(x).hidden=false);
 try{await Promise.all([loadP(),loadC()])}catch(e){toast('تعذر تحميل البيانات: '+e.message)}
 showP();rc();listP();listC()}
async function loadP(){let a=[],s=0;for(;;){const {data,error}=await sb.from('products').select('*').eq('active',true).order('name').range(s,s+999);if(error)throw error;a=a.concat(data);if(data.length<1000)break;s+=1000}P=a}
async function loadC(){const {data,error}=await sb.from('customers').select('*').order('name');if(error)throw error;C=data}
function go(v,b){['pos','prod','cust','soon'].forEach(x=>$('v-'+x).hidden=x!=v);document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('bar').hidden=v!='pos'}
const stk=p=>p.stock>=INF?'∞':p.stock;
function match(v){v=v.toLowerCase();return P.filter(p=>p.barcode==v||p.alt_barcode==v||p.name.toLowerCase().includes(v))}
function showP(){const v=$('q').value.trim();const m=v?match(v).slice(0,30):P.filter(p=>p.stock>0&&p.stock<INF).slice(0,12);
 $('grid').innerHTML=m.map(p=>`<button class="p" onclick="add('${p.id}')"><span>${p.name}</span><b>${f(p.price)} دج</b><small class="${p.stock<=0?'low':''}">مخزون ${stk(p)}</small></button>`).join('')||'<small>لا نتيجة</small>'}
function enter(){const v=$('q').value.trim();const m=match(v);if(m.length==1||m.find(p=>p.barcode==v||p.alt_barcode==v)){add((m.find(p=>p.barcode==v||p.alt_barcode==v)||m[0]).id);$('q').value='';showP()}}
function add(id){const p=P.find(x=>x.id==id);let l=cart.find(x=>x.id==id);const n=(l?l.q:0)+1;
 if(p.stock<INF&&n>p.stock){toast('المخزون غير كافٍ: '+p.stock);return}
 if(l)l.q=n;else cart.push({id,n:p.name,p:p.price,q:1});rc()}
function ch(id,d){const l=cart.find(x=>x.id==id),p=P.find(x=>x.id==id);l.q+=d;if(p.stock<INF&&l.q>p.stock){l.q=p.stock;toast('المخزون غير كافٍ')}if(l.q<=0)cart=cart.filter(x=>x.id!=id);rc()}
function ep(id){const l=cart.find(x=>x.id==id);const v=prompt('السعر',l.p);if(v!==null&&+v>=0){l.p=+v;rc()}}
const sum=()=>cart.reduce((a,l)=>a+l.p*l.q,0);
function rc(){$('cart').innerHTML=cart.map(l=>`<div class="li"><span onclick="ep('${l.id}')">${l.n}<small>${f(l.p)} × ${l.q} = ${f(l.p*l.q)}</small></span><span class="q"><button class="o" onclick="ch('${l.id}',-1)">−</button><b>${l.q}</b><button class="o" onclick="ch('${l.id}',1)">+</button></span></div>`).join('')||'<small>السلة فارغة — اضغط منتجاً أو امسح باركوداً</small>';$('tot').textContent=f(sum())}
function modal(h){$('modc').innerHTML=h;$('mod').hidden=false}function close_(){$('mod').hidden=true}
function payDlg(){if(!cart.length)return;
 modal(`<h3>إتمام البيع</h3><div class="li"><span>المجموع</span><b>${f(sum())} دج</b></div><input id="pd" type="number" inputmode="decimal" placeholder="خصم (دج)" oninput="pcalc()"><select id="pc" onchange="pcalc()"><option value="">بدون زبون</option>${C.map(c=>`<option value="${c.id}">${c.name}${c.debt>0?' — دين '+f(c.debt):''}</option>`).join('')}</select><input id="pp" type="number" inputmode="decimal" placeholder="المبلغ المدفوع" oninput="this.dataset.m=1;pcalc()"><div class="li"><span>المتبقي (دين)</span><b id="rem" class="debt">0.00</b></div><div class="r"><button class="o" onclick="close_()">إلغاء</button><button class="ok" onclick="pay()">تأكيد + طباعة + درج</button></div>`);pcalc()}
function pcalc(){const t=Math.max(sum()-(+$('pd').value||0),0);if(!$('pp').dataset.m)$('pp').value=t;$('rem').textContent=f(Math.max(t-(+$('pp').value||0),0))}
async function pay(){const d=+$('pd').value||0,cid=$('pc').value||null,t=Math.max(sum()-d,0),pd=Math.min(+$('pp').value||0,t);
 const items=cart.map(l=>({id:l.id,qty:l.q,price:l.p}));
 const {data,error}=await sb.rpc('checkout',{p_customer:cid,p_discount:d,p_paid:pd,p_items:items});
 if(error){toast(error.message);return}
 const cn=cid?C.find(c=>c.id==cid).name:'';
 printR(data,d,cn);cart=[];close_();rc();await Promise.all([loadP(),loadC()]);showP();toast('تم البيع رقم '+data.number)}
const asc=s=>String(s).normalize('NFD').replace(/[^\x20-\x7e]/g,'');
function send(b){let s='';b.forEach(x=>s+=String.fromCharCode(x));location.href='rawbt:base64,'+btoa(s)}
const OPEN=[0x1b,0x70,0,25,250];
function printR(r,d,cn){let x='\n   FARES LIBRARY\n'+new Date().toLocaleString('fr-FR')+'\nFacture #'+r.number+(cn?'\nClient: '+asc(cn):'')+'\n------------------------------------------------\n';
 cart.forEach(l=>{x+=asc(l.n).slice(0,46)+'\n   '+l.q+' x '+f(l.p)+' = '+f(l.p*l.q)+'\n'});
 x+='------------------------------------------------\n'+(d?'Remise: '+f(d)+'\n':'')+'TOTAL: '+f(r.total)+' DZD\nPaye: '+f(r.paid)+'\n'+(r.total>r.paid?'Reste: '+f(r.total-r.paid)+'\n':'')+'\n   Merci !\n\n\n';
 send([0x1b,0x40,...new TextEncoder().encode(x),...OPEN,0x1d,0x56,0x42,0])}
async function scan(cb,id){const v=$(id||'vid');if(!v.hidden){stream.getTracks().forEach(t=>t.stop());v.hidden=true;return}
 if(!('BarcodeDetector'in window)){toast('هذا المتصفح لا يدعم المسح — استعمل Chrome');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;await v.play();
  const bd=new BarcodeDetector();(async function loop(){if(v.hidden)return;try{const r=await bd.detect(v);if(r.length){cb(r[0].rawValue);await new Promise(z=>setTimeout(z,1500))}}catch(e){}setTimeout(loop,300)})()}catch(e){toast('تعذر فتح الكاميرا')}}
function listP(){const v=$('pq').value.trim().toLowerCase();$('plist').innerHTML=P.filter(p=>!v||(p.barcode||'').includes(v)||p.name.toLowerCase().includes(v)).slice(0,50).map(p=>`<div class="li" onclick="editP('${p.id}')"><span>${p.name}<small>${p.barcode||''} · شراء ${f(p.cost)}</small></span><span><b>${f(p.price)}</b><small class="${p.stock<=p.alert_at?'low':''}">${stk(p)}</small></span></div>`).join('')}
function editP(id){const p=id?P.find(x=>x.id==id):{barcode:'',name:'',cost:'',price:'',stock:''};
 modal(`<h3>${id?'تعديل':'إضافة'} منتج</h3><div class="r"><input id="eb" placeholder="الباركود" value="${p.barcode||''}"><button class="f0" onclick="scan(v=>{$('eb').value=v;scan(null,'vid2')},'vid2')">📷</button></div><video id="vid2" hidden playsinline muted></video><input id="en" placeholder="الاسم" value="${p.name}"><div class="r"><input id="ek" type="number" placeholder="سعر الشراء" value="${p.cost}"><input id="ep" type="number" placeholder="سعر البيع" value="${p.price}"></div><input id="es" type="number" placeholder="الكمية" value="${p.stock}"><div class="r"><button class="o" onclick="close_()">إلغاء</button>${id?`<button class="no" onclick="delP('${id}')">حذف</button>`:''}<button class="ok" onclick="saveP('${id||''}')">حفظ</button></div>`)}
async function saveP(id){const o={barcode:$('eb').value.trim(),name:$('en').value.trim(),cost:+$('ek').value||0,price:+$('ep').value||0,stock:+$('es').value||0};if(!o.name){toast('الاسم مطلوب');return}
 const {error}=id?await sb.from('products').update(o).eq('id',id):await sb.from('products').insert(o);if(error){toast(error.message);return}
 close_();await loadP();listP();showP()}
async function delP(id){if(!confirm('حذف المنتج؟'))return;const {error}=await sb.from('products').update({active:false}).eq('id',id);if(error){toast(error.message);return}close_();await loadP();listP();showP()}
function listC(){const v=$('cq').value.trim().toLowerCase();$('clist').innerHTML=C.filter(c=>!v||c.name.toLowerCase().includes(v)||(c.phone||'').includes(v)).map(c=>`<div class="li" onclick="custDlg('${c.id}')"><span>${c.name}<small>${c.phone||''}</small></span><b class="${c.debt>0?'debt':''}">${f(c.debt)} دج</b></div>`).join('')||'<small>لا زبائن بعد</small>'}
function editC(){modal(`<h3>زبون جديد</h3><input id="cn" placeholder="الاسم"><input id="ct" type="tel" placeholder="الهاتف"><div class="r"><button class="o" onclick="close_()">إلغاء</button><button class="ok" onclick="saveC()">حفظ</button></div>`)}
async function saveC(){const n=$('cn').value.trim();if(!n){toast('الاسم مطلوب');return}const {error}=await sb.from('customers').insert({name:n,phone:$('ct').value.trim()});if(error){toast(error.message);return}close_();await loadC();listC()}
function custDlg(id){const c=C.find(x=>x.id==id);modal(`<h3>${c.name}</h3><div class="li"><span>الدين الحالي</span><b class="debt">${f(c.debt)} دج</b></div><input id="pa" type="number" inputmode="decimal" placeholder="مبلغ التسديد"><div class="r"><button class="o" onclick="close_()">إغلاق</button><button class="ok" onclick="settle('${id}')">تسجيل دفعة</button></div>`)}
async function settle(id){const a=+$('pa').value;if(!(a>0)){toast('أدخل مبلغاً صحيحاً');return}const {error}=await sb.rpc('pay_debt',{p_customer:id,p_amount:a});if(error){toast(error.message);return}close_();await loadC();listC();toast('تم تسجيل الدفعة')}
init();
</script></body></html>
